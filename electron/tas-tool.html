      resultsBtn.addEventListener("click", function(){ try { openResults(); } catch(e) {} });

      // ------------------------------------------------------------- Full run
      var fullRunBusy = false;
      function frameToTime(frames){
        // 1000 Hz, so a frame is a millisecond and the run time reads straight off.
        return (frames / 1000).toFixed(3) + " s";
      }
      halfStepBtn.addEventListener("click", function(){
        var start = readInt("bf-start", 0, 0);
        var finish = readInt("bf-finish", start, 0, 999999);
        var span = finish - start;
        if (span < 2) {
          status.textContent = "The search window is " + (span < 0 ? "inside out" : "too narrow") +
            " to split - set Finish search later than Start frame first. Frame step is unchanged.";
          return;
        }
        var half = Math.max(1, Math.floor(span / 2));
        var value = half > 1 ? ("1-" + half) : "1";
        if ($("bf-step")) $("bf-step").value = value;
        status.textContent = "Frame step set to " + value + " - half the " + span +
          " frame search window, so an inserted input can land anywhere from the next frame to right across the run.";
      });

      fullRunBtn.addEventListener("click", function(){
        if (fullRunBusy) return;
        var text = ($("decoded") && $("decoded").value) || "";
        if (!text.trim()) { status.textContent = "There are no inputs to measure."; return; }
        if (!window.electron || !window.electron.tasToolMeasureRun) return;
        fullRunBusy = true;
        var label = fullRunBtn.textContent;
        fullRunBtn.textContent = "Measuring…";
        fullRunBtn.disabled = true;
        status.textContent = "Simulating the current inputs to find where the run ends…";
        window.electron.tasToolMeasureRun({ baseText: text }).then(function(res){
          if (!res) { status.textContent = "The run could not be measured."; return; }
          if (res.error) { status.textContent = "Could not measure the run: " + res.error; return; }
          if (res.finishFrames == null) {
            // Deliberately leaves both fields alone: there is no end of the run to
            // set them to, and quietly picking the simulation limit instead would
            // be worse than doing nothing.
            status.textContent = "These inputs never cross the finish line" +
              (res.simulatedFrames ? (" within " + frameToTime(res.simulatedFrames)) : "") +
              ", so there is no end of run to set. Finish search and Evaluate at frame are unchanged.";
            return;
          }
          if ($("bf-finish")) $("bf-finish").value = String(res.finishFrames);
          if ($("bf-eval")) $("bf-eval").value = String(res.finishFrames);
          status.textContent = "The run finishes on frame " + res.finishFrames + " (" +
            frameToTime(res.finishFrames) + "). Finish search and Evaluate at frame set to it.";
        }).catch(function(e){
          status.textContent = "Could not measure the run: " + ((e && e.message) || e);
        }).then(function(){
          fullRunBusy = false;
          fullRunBtn.textContent = label;
          fullRunBtn.disabled = false;
        });
      });

      var currentFreeCamCoords = null;
      function setFieldVisible(input, visible){
        if (!input) return;
        var wrap = input.parentElement;
        if (wrap) wrap.style.display = visible ? "flex" : "none";
        input.disabled = !visible;
      }
      function setNodeVisible(node, visible, shownDisplay){
        if (!node) return;
        node.style.display = visible ? (shownDisplay || "") : "none";
        if ("disabled" in node) node.disabled = !visible;
      }
      function refreshModeControls(){
        var mode = modeSel.value;
        var distanceMode = sel.value === "distance_speed";
        var triggerBlendMode = sel.value === "trigger_time_speed";
        var usesNewInputs = mode === "inputs_timing" || mode === "inputs_only";
        var usesTiming = mode === "inputs_timing" || mode === "timing_only";
        var lisMode = mode === "lis";

        setFieldVisible(stepInput, usesNewInputs);
        setNodeVisible(halfStepWrap, usesNewInputs, "flex");
        setFieldVisible(holdInput, usesNewInputs);
        setFieldVisible(timeDiffInput, usesTiming);
        setNodeVisible(keyWrap, usesNewInputs, "flex");

        setFieldVisible(targetX, distanceMode);
        setFieldVisible(targetY, distanceMode);
        setFieldVisible(targetZ, distanceMode);
        setNodeVisible(markerStyleWrap, distanceMode, "flex");
        setFieldVisible(markerColor, distanceMode);
        setFieldVisible(markerSize, distanceMode);
        setNodeVisible(useFreeCamBtn, distanceMode, "inline-block");
        setNodeVisible(camReadout, distanceMode, "inline");
        setFieldVisible(distanceWeightSlider, distanceMode);
        setFieldVisible(triggerSpeedWeightSlider, triggerBlendMode);
        setFieldVisible(lisWeightSlider, lisMode);
        setNodeVisible(scoreRow, distanceMode || triggerBlendMode || lisMode, "flex");

        setNodeVisible(fullRunWrap, sel.value === "finish", "flex");
        var triggerMode = invalidationMode.checked || ["trigger","trigger_speed","trigger_time_speed","trigger_sequence"].indexOf(sel.value) >= 0;
        setNodeVisible(triggerPanel, triggerMode, "flex");
        refreshTriggerFieldVisibility();
        pushTriggerToGame();

        var parts = [];
        if (mode === "inputs_timing") parts.push("Candidates insert or replace inputs and may shift one existing input timing.");
        else if (mode === "inputs_only") parts.push("Candidates only insert or replace inputs.");
        else if (mode === "timing_only") parts.push("Candidates only shift existing input timings; keysets, frame step and hold length are ignored.");
        else parts.push("LIS candidates remove existing input-change events; frame step, hold length, timing difference and keysets are ignored.");
        if (distanceMode) parts.push("Distance + speed uses the target coordinates and weighting slider.");
        if (sel.value === "trigger") parts.push("Trigger searches for the earliest frame on which the car's collision geometry enters the selected trigger volume; candidates that miss are ranked by how close they came.");
        else if (sel.value === "trigger_speed") parts.push("Trigger (most speed) keeps whichever run enters the selected trigger volume carrying the most speed, whenever it gets there; candidates that miss are ranked by how close they came.");
        else if (sel.value === "trigger_time_speed") parts.push("Trigger (time + speed) balances early arrival against speed at contact using the weighting slider.");
        else if (sel.value === "trigger_sequence") parts.push("Sequential triggers must be reached in the numbered order; disabled triggers are skipped without losing their configuration.");
        if (invalidationMode.checked) parts.push("Any enabled trigger marked Instantly invalidate is an exclusion zone; touching it stops and rejects the candidate before the normal objective is scored.");
        if (lisMode) parts.push("The LIS slider balances the selected objective against fewer inputs.");
        parts.push("Inputs are searched inclusively from Start frame through Finish search; the search continues until Cancel.");
        helpText.textContent = parts.join(" ");
      }
      sel.addEventListener("change", refreshModeControls);
      modeSel.addEventListener("change", refreshModeControls);
      invalidationMode.addEventListener("change", function(){ refreshModeControls(); refreshBackendControls(); });
      refreshTriggerList();
      writeTriggerToFields();
      refreshModeControls();
      pushTriggerToGame();
      useFreeCamBtn.addEventListener("click", function(){
        if (!currentFreeCamCoords) { status.textContent = "Enable free cam in the game first, then move it to the desired target point."; return; }
        targetX.value = Number(currentFreeCamCoords.x || 0).toFixed(3);
        targetY.value = Number(currentFreeCamCoords.y || 0).toFixed(3);
        targetZ.value = Number(currentFreeCamCoords.z || 0).toFixed(3);
        pushTriggerToGame();
      });
      if (window.electron && window.electron.onTasToolFreeCamCoords) {
        window.electron.onTasToolFreeCamCoords(function(info){
          try {
            var live = !!(info && info.active !== false);
            freeCamBtn.textContent = live ? "Exit Free Cam" : "Free Cam";
            trigCamBtn.disabled = !live;
          } catch(e) {}
          if (!info || info.active === false) { currentFreeCamCoords = null; camReadout.textContent = "Free cam: not active"; return; }
          currentFreeCamCoords = { x:Number(info.x)||0, y:Number(info.y)||0, z:Number(info.z)||0 };
          camReadout.textContent = "Free cam: X " + currentFreeCamCoords.x.toFixed(2) + "  Y " + currentFreeCamCoords.y.toFixed(2) + "  Z " + currentFreeCamCoords.z.toFixed(2);
        });
      }
      driveSpeed.addEventListener("input", function(){
        driveSpeedOut.textContent = driveSpeed.value + "%";
        try {
          var rate = Math.max(.05, Number(driveSpeed.value) / 100);
          window.electron.tasToolSlowMoRate({ rate: rate });
          window.electron.tasToolDriveRate({ rate: rate });
        } catch(e) {}
      });
      driveStartBtn.addEventListener("click", function(){
        try {
          var text = ($("decoded") && $("decoded").value) || "";
          if (!parseEntries(text).length) { driveReadout.textContent = "Add at least one TAS input first."; return; }
          driveStartBtn.disabled = true; driveStopBtn.disabled = false; driveDiscardBtn.disabled = false;
          driveReadout.textContent = "Replaying to TAS end…";
          window.electron.tasToolDriveStart({
            text:text,
            rate:Math.max(.05, Number(driveSpeed.value) / 100),
            bindings:Object.assign({}, driveBindings)
          });
        } catch(e) { driveStartBtn.disabled = false; driveStopBtn.disabled = true; driveDiscardBtn.disabled = true; driveReadout.textContent = "Could not start: " + (e.message || e); }
      });
      driveStopBtn.addEventListener("click", function(){
        try { driveReadout.textContent = "Stopping and keeping continuation inputs…"; window.electron.tasToolDriveStop({ commit:true }); } catch(e) {}
      });
      driveDiscardBtn.addEventListener("click", function(){
        try { driveReadout.textContent = "Stopping and discarding this continuation attempt…"; window.electron.tasToolDriveStop({ commit:false }); } catch(e) {}
      });
      if (window.electron && window.electron.onTasToolDriveStatus) {
        window.electron.onTasToolDriveStatus(function(info){
          info = info || {};
          if (info.status === "starting") driveReadout.textContent = "Sending drive mode to the replay screen for frame " + (info.takeoverFrame != null ? info.takeoverFrame : "…") + "…";
          else if (info.status === "restarting") { driveStartBtn.disabled = true; driveStopBtn.disabled = false; driveDiscardBtn.disabled = false; driveReadout.textContent = "Restarting from the TAS endpoint…"; }
          else if (info.status === "received") driveReadout.textContent = "Replay screen received drive mode. Preparing the simulation…";
          else if (info.status === "preroll") driveReadout.textContent = "Fast-forwarding to frame " + (info.takeoverFrame != null ? info.takeoverFrame : "…") + "… the game window has keyboard focus.";
          else if (info.status === "snapshotting") driveReadout.textContent = "Saving the exact physics state at the TAS endpoint…";
          else if (info.status === "restoring") driveReadout.textContent = "Restoring the saved TAS endpoint instantly…";
          else if (info.status === "driving") { driveStartBtn.disabled = true; driveStopBtn.disabled = false; driveDiscardBtn.disabled = false; driveReadout.textContent = "Driving at " + Math.round((Number(info.rate)||Number(driveSpeed.value)/100)*100) + "% — " + driveHotkeyText() + " from the TAS endpoint."; }
          else if (info.status === "rate") { driveReadout.textContent = "Driving at " + Math.round((Number(info.rate)||Number(driveSpeed.value)/100)*100) + "% — " + driveHotkeyText() + " from the TAS endpoint."; }
          else if (info.status === "stopped") { driveStartBtn.disabled = false; driveStopBtn.disabled = true; driveDiscardBtn.disabled = true; if (info.text) setHuman(info.text); driveReadout.textContent = "Continuation inputs kept in the editor through frame " + (info.frames != null ? info.frames : "…") + "."; }
          else if (info.status === "aborted") { driveStartBtn.disabled = false; driveStopBtn.disabled = true; driveDiscardBtn.disabled = true; driveReadout.textContent = "Continuation stopped and the recorded attempt was discarded."; }
          else if (info.status === "error") { driveStartBtn.disabled = false; driveStopBtn.disabled = true; driveDiscardBtn.disabled = true; driveReadout.textContent = "Drive mode error" + (info.stage ? " [" + info.stage + "]" : "") + ": " + (info.message || "unknown error"); }
        });
      }

      if (window.electron && window.electron.onTasToolBruteforceProgress) {
        window.electron.onTasToolBruteforceProgress(function(p){
          try {
            if (!p) return;
            var session = bfSession;
            if (!session || !session.running) return;
            if (p.runId && !session.activeRunId) session.activeRunId = p.runId;
            if (p.runId && session.activeRunId && p.runId !== session.activeRunId) return;
            session.tested = Math.max(session.tested, Number(p.done) || 0);
            session.round = Math.max(session.round, Number(p.wave) || 0);
            session.improvements = Math.max(session.improvements, Number(p.improvements) || 0);
            if (p.candidatesPerSecond != null) session.nativeCandidatesPerSecond = Number(p.candidatesPerSecond) || 0;
            if (p.physicsFramesPerSecond != null) session.nativePhysicsFramesPerSecond = Number(p.physicsFramesPerSecond) || 0;
            if (p.equivalentPhysicsFramesPerSecond != null) session.equivalentPhysicsFramesPerSecond = Number(p.equivalentPhysicsFramesPerSecond) || 0;
            if (p.best && p.best.text) {
              session.currentBest = p.best;
              session.currentBaseText = p.best.text;
              lastBest = p.best;
              applyBestBtn.disabled = false;
              recordImprovement(p.best, session.tested, session.round);
            }
            if (session.cancelling) { status.textContent = cancellingText(session); return; }
            var msg = (p.message || "Native PolySim search running…") + "\nTotal tested: " + session.tested + " (runs until Cancel).\n" + speedLine(session, session.tested);
            if (p.threads) msg += "\nNative threads: " + p.threads + " | rolling wave: " + session.round + " | improvements: " + session.improvements;
            if (session.currentBest) msg += "\nAccepted rolling best: " + bestSummary(session.currentBest);
            status.textContent = msg;
          } catch(e) {}
        });
      }
      if (window.electron && window.electron.onTasToolBruteforceResult) {
        window.electron.onTasToolBruteforceResult(function(p){
          try {
            if (!p) return;
            var session = bfSession;
            if (!session || !session.running) return;
            if (p.runId && session.activeRunId && p.runId !== session.activeRunId && !session.cancelling) return;
            if (p.status === "error") { finishSession("Bruteforce error: " + (p.message || "unknown error")); return; }
            session.tested = Math.max(session.tested, Number(p.done) || 0);
            if (p.candidatesPerSecond != null) session.nativeCandidatesPerSecond = Number(p.candidatesPerSecond) || 0;
            if (p.physicsFramesPerSecond != null) session.nativePhysicsFramesPerSecond = Number(p.physicsFramesPerSecond) || 0;
            if (p.equivalentPhysicsFramesPerSecond != null) session.equivalentPhysicsFramesPerSecond = Number(p.equivalentPhysicsFramesPerSecond) || 0;
            var roundBest = p.best || null;
            if (roundBest && roundBest.text) { session.currentBest = roundBest; session.currentBaseText = roundBest.text; }
            lastBest = session.currentBest || lastBest;
            applyBestBtn.disabled = !(lastBest && lastBest.text);
            recordImprovement(session.currentBest, session.tested, session.round);
            refreshSnapshot();
            finishSession((session.cancelling ? "Bruteforce cancelled after " : "Bruteforce stopped after ") +
              session.tested + " candidates.\nBest retained: " + bestSummary(session.currentBest));
          } catch(e) {
            finishSession("Bruteforce result handling failed: " + (e && e.message ? e.message : e));
          }
        });
      }
    } catch(e) {}
  });
  </script>

</body>
</html>
